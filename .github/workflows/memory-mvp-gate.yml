name: Memory MVP Gate

on:
  pull_request:
    paths:
      - '.claude/lib/memory/**'
      - '.claude/lib/spawn/**'
      - '.claude/hooks/reflection/**'
      - '.claude/hooks/routing/spawn-prompt-assembler.cjs'
      - 'tests/lib/memory/**'
      - 'tests/hooks/spawn-prompt-memory-mode.test.cjs'
      - 'tests/hooks/unified-reflection-handler.test.cjs'
      - '.claude/docs/MEMORY_SYSTEM.md'
      - '.claude/docs/@ENVIRONMENT_CONFIG.md'
      - '.env.example'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-mvp-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENT_STUDIO_ENV: staging
      OPEN_FINDINGS_RESOLUTION_MODE: strict

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 11.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -s lint

      - name: Run memory CI tests
        run: pnpm run test:memory:ci

      - name: Run framework test gate
        run: pnpm run test:framework

      - name: Run findings summary gate (strict mode rollout)
        run: pnpm run metrics:findings:ci
