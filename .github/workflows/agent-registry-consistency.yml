name: Agent Registry Consistency

on:
  pull_request:
    paths:
      - '.claude/agents/**'
      - '.claude/context/agent-registry.json'
      - '.claude/tools/cli/generate-agent-registry.cjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate agent registry
        run: npm run gen:agent-registry

      - name: Verify registry is up to date
        shell: bash
        run: |
          normalize_registry() {
            local source_path="$1"
            local output_path="$2"

            node - "$source_path" "$output_path" <<'NODE'
          const fs = require('fs');

          const inputPath = process.argv[2];
          const outputPath = process.argv[3];
          const registry = JSON.parse(fs.readFileSync(inputPath, 'utf8'));

          delete registry.generatedAt;
          if (registry.metadata && typeof registry.metadata === 'object') {
            delete registry.metadata.lastHealthCheck;
            delete registry.metadata.lastFullScan;
          }

          for (const card of Object.values(registry.agents || {})) {
            if (!card || typeof card !== 'object') continue;
            if (card.health && typeof card.health === 'object') {
              delete card.health.lastUpdate;
            }
            if (card.metadata && typeof card.metadata === 'object') {
              delete card.metadata.createdAt;
              delete card.metadata.updatedAt;
            }
          }

          fs.writeFileSync(outputPath, JSON.stringify(registry, null, 2) + '\n');
          NODE
          }

          baseline_raw="$(mktemp)"
          baseline_normalized="$(mktemp)"
          current_normalized="$(mktemp)"

          git show HEAD:.claude/context/agent-registry.json > "$baseline_raw"
          normalize_registry "$baseline_raw" "$baseline_normalized"
          normalize_registry ".claude/context/agent-registry.json" "$current_normalized"

          if diff -u "$baseline_normalized" "$current_normalized"; then
            echo "Agent registry is up to date."
          else
            echo "Agent registry is stale. Run: npm run gen:agent-registry"
            exit 1
          fi
