name: Skill Build Validation

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/lib/skill-build/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.claude/skills/**'
      - '.claude/lib/skill-build/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation check
        run: |
          if [ -f .claude/lib/skill-build/tsconfig.json ]; then
            npx tsc --project .claude/lib/skill-build/tsconfig.json --noEmit
          else
            echo "No skill-build TypeScript project found, skipping tsc check"
          fi

      - name: Enforce ecosystem gate
        run: pnpm skills:ecosystem:gate

      - name: Validate rule structure
        run: npm run skills:validate
        continue-on-error: false

      - name: Extract test cases
        run: npm run skill:extract-tests
        continue-on-error: true

      - name: Build skills
        run: npm run skill:build
        continue-on-error: true

      - name: Report results
        if: always()
        run: |
          echo "::group::Validation Summary"
          echo "✓ TypeScript compilation passed"
          echo "✓ Rule structure validation passed"
          echo "::endgroup::"
