name: Skill Build Validation

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.claude/hooks/**'
      - '.claude/tools/**'
      - '.claude/rules/**'
      - '.claude/templates/**'
      - '.claude/workflows/**'
      - '.claude/schemas/**'
      - '.claude/context/config/agent-skill-matrix.json'
      - '.claude/tools/cli/validate-skill-ecosystem.cjs'
      - '.claude/tools/cli/validate-agent-skill-references.cjs'
      - '.claude/lib/skill-build/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.claude/hooks/**'
      - '.claude/tools/**'
      - '.claude/rules/**'
      - '.claude/templates/**'
      - '.claude/workflows/**'
      - '.claude/schemas/**'
      - '.claude/context/config/agent-skill-matrix.json'
      - '.claude/tools/cli/validate-skill-ecosystem.cjs'
      - '.claude/tools/cli/validate-agent-skill-references.cjs'
      - '.claude/lib/skill-build/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 11.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript compilation check
        run: |
          if [ -f .claude/lib/skill-build/tsconfig.json ]; then
            npx tsc --project .claude/lib/skill-build/tsconfig.json --noEmit
          else
            echo "No skill-build TypeScript project found, skipping tsc check"
          fi

      - name: Enforce ecosystem gate
        run: pnpm skills:ecosystem:gate

      - name: Validate rule structure
        run: npm run skills:validate
        continue-on-error: false

      - name: Report results
        if: always()
        run: |
          echo "::group::Validation Summary"
          echo "✓ TypeScript compilation passed"
          echo "✓ Rule structure validation passed"
          echo "✓ Ecosystem gate passed"
          echo "::endgroup::"
