name: Observability CI

on:
  pull_request:
    paths:
      - '.claude/lib/monitoring/**'
      - '.claude/lib/events/**'
      - '.claude/lib/utils/hook-runner.cjs'
      - '.claude/lib/utils/hook-worker-bridge.cjs'
      - '.claude/hooks/benchmarks/**'
      - '.claude/hooks/validation/flight-recorder-schema-gate.cjs'
      - '.claude/hooks/monitoring/slo-alert-gate.cjs'
      - '.claude/tools/cli/trace-query.cjs'
      - 'tests/lib/monitoring/**'
      - 'tests/integration/event-telemetry-sink.test.cjs'
      - 'tests/integration/trace-linkage.test.cjs'
      - 'tests/tools/trace-query-cli.test.cjs'
      - 'tests/hooks/benchmarks/perf-regression-gate.test.cjs'
      - 'tests/hooks/benchmarks/perf-gate-ci-integration.test.cjs'
      - 'tests/validation/flight-recorder-schema-gate.test.cjs'
      - 'tests/hooks/monitoring/slo-alert-gate.test.cjs'
      - '.github/workflows/observability-ci.yml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.claude/lib/monitoring/**'
      - '.claude/lib/events/**'
      - '.claude/lib/utils/hook-runner.cjs'
      - '.claude/lib/utils/hook-worker-bridge.cjs'
      - '.claude/hooks/benchmarks/**'
      - '.claude/hooks/validation/flight-recorder-schema-gate.cjs'
      - '.claude/hooks/monitoring/slo-alert-gate.cjs'
      - '.claude/tools/cli/trace-query.cjs'
      - 'tests/lib/monitoring/**'
      - 'tests/integration/event-telemetry-sink.test.cjs'
      - 'tests/integration/trace-linkage.test.cjs'
      - 'tests/tools/trace-query-cli.test.cjs'
      - 'tests/hooks/benchmarks/perf-regression-gate.test.cjs'
      - 'tests/hooks/benchmarks/perf-gate-ci-integration.test.cjs'
      - 'tests/validation/flight-recorder-schema-gate.test.cjs'
      - 'tests/hooks/monitoring/slo-alert-gate.test.cjs'
      - '.github/workflows/observability-ci.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -s lint

      - name: Run observability test slice
        run: node --test tests/lib/monitoring/flight-recorder-rotation.test.cjs tests/lib/monitoring/flight-recorder-replay.test.cjs tests/lib/monitoring/slo-rollups.test.cjs tests/tools/trace-query-cli.test.cjs tests/integration/event-telemetry-sink.test.cjs tests/integration/trace-linkage.test.cjs tests/validation/flight-recorder-schema-gate.test.cjs tests/hooks/monitoring/slo-alert-gate.test.cjs tests/hooks/benchmarks/perf-regression-gate.test.cjs

      - name: Perf gate
        run: node .claude/hooks/benchmarks/perf-gate.cjs
        env:
          HOOK_RUNNER_MODE: worker
          PERF_GATE_MAX_LATENCY_MS: 5

      - name: Flight recorder schema gate
        run: node .claude/hooks/validation/flight-recorder-schema-gate.cjs
        env:
          FLIGHT_RECORDER_SCHEMA_GATE_STRICT: 'true'

      - name: Capture failure evidence
        if: failure()
        shell: bash
        env:
          FAILURE_ARTIFACT_NAME: failure-evidence-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          FAILURE_STAGE: observability-ci
        run: |
          mkdir -p .claude/context/ci
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { writeFailureEvidence } = require('./.claude/lib/ci/failure-evidence.cjs');

          const root = process.cwd();
          const evidencePath = writeFailureEvidence(root, {
            env: process.env,
            failure: {
              workflow: process.env.GITHUB_WORKFLOW,
              job: process.env.GITHUB_JOB,
              stage: process.env.FAILURE_STAGE,
            },
          });
          const summaryPath = path.join(root, '.claude', 'context', 'ci', 'failure-evidence-summary.json');
          fs.writeFileSync(
            summaryPath,
            JSON.stringify(
              {
                artifacts: [
                  {
                    name: process.env.FAILURE_ARTIFACT_NAME,
                    kind: 'failure_evidence',
                    createdAt: new Date().toISOString(),
                    path: path.relative(root, evidencePath),
                  },
                ],
              },
              null,
              2
            )
          );
          NODE

      - name: Upload failure evidence artifact
        if: failure()
        id: upload-failure-evidence
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .claude/context/ci/failure-evidence/
            .claude/context/ci/failure-evidence-summary.json

      - name: Write failure evidence summary
        if: failure()
        shell: bash
        env:
          FAILURE_ARTIFACT_NAME: failure-evidence-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          FAILURE_ARTIFACT_URL: ${{ steps.upload-failure-evidence.outputs.artifact-url }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const summaryPath = path.join(process.cwd(), '.claude', 'context', 'ci', 'failure-evidence-summary.json');
          const payload = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          if (Array.isArray(payload.artifacts) && payload.artifacts[0]) {
            payload.artifacts[0].name = process.env.FAILURE_ARTIFACT_NAME;
            if (process.env.FAILURE_ARTIFACT_URL) {
              payload.artifacts[0].url = process.env.FAILURE_ARTIFACT_URL;
            }
          }
          fs.writeFileSync(summaryPath, JSON.stringify(payload, null, 2));
          NODE
          pnpm ci:summary:write --kind failure-evidence --input .claude/context/ci/failure-evidence-summary.json
