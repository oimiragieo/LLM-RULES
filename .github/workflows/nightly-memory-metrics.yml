name: Nightly Memory Metrics

on:
  schedule:
    # Periodic trend snapshots (UTC)
    - cron: '*/30 * * * *'
    # Nightly strict gate (UTC)
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  findings-trend-snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_STUDIO_ENV: staging
      OPEN_FINDINGS_RESOLUTION_MODE: strict

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 11.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record periodic findings trend snapshot
        run: pnpm run metrics:findings:trend:snapshot

  nightly-strict-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_STUDIO_ENV: staging
      OPEN_FINDINGS_RESOLUTION_MODE: strict

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 11.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cleanup transient artifacts
        run: pnpm run cleanup:transient

      - name: Run strict nightly memory/findings gate
        run: pnpm run metrics:nightly:strict

      - name: Create alert issue on nightly strict gate failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const title = `[Nightly Strict Gate] Failure on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              'Nightly strict memory/findings gate failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              `Triggered by: ${context.eventName}`,
              '',
              'Please inspect logs and resolve regressions before the next scheduled run.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci', 'nightly', 'memory']
            });
