name: Memory CI

on:
  pull_request:
    paths:
      - '.claude/lib/memory/**'
      - '.claude/lib/spawn/**'
      - '.claude/hooks/reflection/**'
      - '.claude/skills/recommend-evolution/**'
      - '.claude/hooks/routing/spawn-prompt-assembler.cjs'
      - 'tests/lib/memory/**'
      - 'tests/hooks/spawn-prompt-memory-mode.test.cjs'
      - 'tests/hooks/unified-reflection-handler.test.cjs'
      - 'tests/hooks/unified-reflection-stale-evolution.test.cjs'
      - 'tests/hooks/audit-skill-recency.test.cjs'
      - 'tests/lib/evolution/evolution-request-router.test.cjs'
      - 'tests/integration/evolution-stale-skill-flow.test.cjs'
      - 'tests/skills/skill-updater-doc-contract.test.cjs'
      - 'tests/skills/recommend-evolution-main.test.cjs'
      - '.claude/docs/MEMORY_SYSTEM.md'
      - '.claude/docs/@ENVIRONMENT_CONFIG.md'
      - '.env.example'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.claude/lib/memory/**'
      - '.claude/lib/spawn/**'
      - '.claude/hooks/reflection/**'
      - '.claude/skills/recommend-evolution/**'
      - '.claude/hooks/routing/spawn-prompt-assembler.cjs'
      - 'tests/lib/memory/**'
      - 'tests/hooks/spawn-prompt-memory-mode.test.cjs'
      - 'tests/hooks/unified-reflection-handler.test.cjs'
      - 'tests/hooks/unified-reflection-stale-evolution.test.cjs'
      - 'tests/hooks/audit-skill-recency.test.cjs'
      - 'tests/lib/evolution/evolution-request-router.test.cjs'
      - 'tests/integration/evolution-stale-skill-flow.test.cjs'
      - 'tests/skills/skill-updater-doc-contract.test.cjs'
      - 'tests/skills/recommend-evolution-main.test.cjs'
      - '.claude/docs/MEMORY_SYSTEM.md'
      - '.claude/docs/@ENVIRONMENT_CONFIG.md'
      - '.env.example'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_STUDIO_ENV: staging
      OPEN_FINDINGS_RESOLUTION_MODE: strict

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm -s format:check

      - name: Lint
        run: pnpm -s lint

      - name: Run memory CI gate
        run: pnpm run test:memory:ci

      - name: Run framework test gate
        run: pnpm run test:framework

      - name: Run hook performance regression gate
        run: node .claude/hooks/benchmarks/perf-gate.cjs
        env:
          HOOK_RUNNER_MODE: worker
          PERF_GATE_MAX_LATENCY_MS: 5

      - name: Run flight recorder schema gate
        run: node .claude/hooks/validation/flight-recorder-schema-gate.cjs
        env:
          FLIGHT_RECORDER_SCHEMA_GATE_STRICT: 'true'

      - name: Run memory SLO CI checks
        run: pnpm run metrics:memory:slo:ci

      - name: Run memory cache stability CI checks
        run: pnpm run metrics:memory-cache:ci

      - name: Run findings CI checks (strict mode rollout)
        run: pnpm run metrics:findings:ci
