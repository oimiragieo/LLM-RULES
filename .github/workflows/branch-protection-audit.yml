name: Branch Protection Audit

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-main-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch protection required checks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const checksConfigPath = '.claude/config/required-status-checks.json';

            async function loadRequiredChecks() {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: checksConfigPath,
                ref: branch
              });

              if (Array.isArray(response.data) || !response.data?.content) {
                throw new Error(`Invalid required checks config payload at ${checksConfigPath}`);
              }

              const decoded = Buffer.from(response.data.content, 'base64').toString('utf8');
              const parsed = JSON.parse(decoded);
              const checks = parsed?.required_checks;

              if (!Array.isArray(checks) || checks.length === 0) {
                throw new Error(`required_checks missing or empty in ${checksConfigPath}`);
              }

              const normalized = checks.map((name) => String(name).trim()).filter(Boolean);
              if (normalized.length === 0) {
                throw new Error(`required_checks contains no valid entries in ${checksConfigPath}`);
              }

              return normalized;
            }

            let expectedChecks;
            try {
              expectedChecks = await loadRequiredChecks();
            } catch (err) {
              core.setFailed(`Unable to load required status checks: ${err.message}`);
              return;
            }

            let protection;
            try {
              const response = await github.rest.repos.getBranchProtection({
                owner,
                repo,
                branch
              });
              protection = response.data;
            } catch (err) {
              core.setFailed(`Branch protection missing or unreadable for ${branch}: ${err.message}`);
              return;
            }

            const contexts = protection?.required_status_checks?.contexts || [];
            const missing = expectedChecks.filter(name => !contexts.some(ctx => String(ctx).includes(name)));
            if (missing.length > 0) {
              core.setFailed(
                `Branch protection for ${branch} missing required checks: ${missing.join(', ')}. Found: ${contexts.join(', ')}`
              );
              return;
            }

            core.info(`Branch protection OK for ${branch}. Required checks found.`);

      - name: Create issue on audit failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const checksConfigPath = '.claude/config/required-status-checks.json';

            async function loadRequiredChecks() {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: checksConfigPath,
                ref: branch
              });

              if (Array.isArray(response.data) || !response.data?.content) {
                throw new Error(`Invalid required checks config payload at ${checksConfigPath}`);
              }

              const decoded = Buffer.from(response.data.content, 'base64').toString('utf8');
              const parsed = JSON.parse(decoded);
              const checks = parsed?.required_checks;

              if (!Array.isArray(checks) || checks.length === 0) {
                throw new Error(`required_checks missing or empty in ${checksConfigPath}`);
              }

              const normalized = checks.map((name) => String(name).trim()).filter(Boolean);
              if (normalized.length === 0) {
                throw new Error(`required_checks contains no valid entries in ${checksConfigPath}`);
              }

              return normalized;
            }

            let expectedChecks = [];
            try {
              expectedChecks = await loadRequiredChecks();
            } catch (err) {
              expectedChecks = ['memory-ci', 'memory-mvp-gate', 'nightly-strict-gate'];
              core.warning(`Failed to load required checks config, falling back to defaults: ${err.message}`);
            }

            const title = `[Branch Protection Audit] Missing required checks on main (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'Automated branch protection audit failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              `Checks config: ${checksConfigPath}`,
              'Expected status checks:',
              ...expectedChecks.map((name) => `- ${name}`)
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci', 'governance', 'branch-protection']
            });
