name: Commands Validation

on:
  pull_request:
    paths:
      - '.claude/commands/**'
      - '.claude/tools/validate-commands.mjs'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.claude/commands/**'
      - '.claude/tools/validate-commands.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce ecosystem gate
        run: pnpm skills:ecosystem:gate

      - name: Validate commands
        run: npm run validate:commands
