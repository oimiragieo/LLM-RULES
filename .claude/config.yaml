# Unified Enterprise AI Framework Configuration
# Merges capabilities from Legacy, Superpowers, and Claude-Flow

# --- Metadata (Version Tracking) ---
metadata:
  version: '3.1.0'
  last_updated: '2026-04-02'
  updated_by: 'developer-agent'
  config_modernization: 'Task #2 - Auto-compression enabled, env vars documented, agent models expanded'

# --- Claude API Beta Headers (Context Management) ---
# Enables auto-clearing of stale tool results from context window (84% token reduction)
apiHeaders:
  - 'context-management-2025-06-27'

# --- Router Configuration (The Gatekeeper) ---
agent_routing:
  router:
    model: haiku
    complexity: low
    priority: highest
    context_strategy: minimal
    description: 'Lightweight router to classify intent and assign optimal agent/workflow.'

# --- Agent Defaults (Token Optimization) ---
# All agents default to lazy loading to save tokens.
defaults:
  context_strategy: lazy_load
  token_optimization:
    enabled: true
    pruning_threshold_lines: 100
    auto_summary: true

# --- Integration Settings ---
integrations:
  superpowers:
    tdd_enforcement: true
    plan_execution: batch
  claude_flow:
    swarm_topology: hierarchical
    consensus: byzantine

# --- Token Monitoring ---
token_monitoring:
  enabled: true
  max_session_tokens: 800000 # Warning threshold (best-effort estimate in user-prompt-unified)
  hard_limit: 950000 # Action required (best-effort estimate in user-prompt-unified)
# --- Evolution Settings (Self-Evolution System) ---
evolution:
  auto_start: true # EVOLVE workflow auto-triggers when new artifacts block (opt-out mode)
  rate_limit: 3 # Max evolutions per hour
  rate_limit_window_ms: 3600000 # 1 hour in milliseconds

# --- Monitoring Settings ---
monitoring:
  enabled: true
  thresholds:
    hookExecutionTimeMs: 100 # Alert if hook takes longer than 100ms
    hookFailureRate: 5 # Alert if failure rate exceeds 5%
    agentFailureRate: 3 # Alert if agent failure rate exceeds 3%
    errorRatePerHour: 10 # Alert if more than 10 errors per hour
    tokenBudgetPerDay: 100000 # Daily token budget
  retention:
    metricsDays: 30 # Keep metrics for 30 days
    errorsDays: 90 # Keep error logs for 90 days
  dashboard:
    refreshIntervalMs: 5000 # Refresh every 5 seconds in live mode

# --- Memory Management Configuration ---
memory:
  rotation:
    threshold_kb: 20 # Rotate hot memory files when they exceed 20KB
    max_age_days: 30 # Archive warm files older than 30 days to cold storage
  pruning:
    similarity_threshold: 0.6 # Cosine similarity threshold for deduplication (0.6 = 60% similar)
  cold_storage:
    max_age_days: 30 # Archive warm storage to cold after 30 days

# --- Feature Flags (Gradual Rollout System) ---
# Controls for safe, gradual rollout of new features
# Priority: Environment Variables > Config File > Runtime API
# Override via: PARTY_MODE_ENABLED=true, ELICITATION_ENABLED=true
features:
  partyMode:
    enabled: true # Multi-agent collaboration (PRODUCTION READY)
    maxAgents: 4 # Maximum agents per round (SEC-PM-005)
    maxRounds: 10 # Maximum rounds per session (SEC-PM-005)
    contextWarning: 800000 # Token warning threshold
    contextLimit: 950000 # Token hard limit
    costLimit: 50.0 # Cost limit per session (USD)
  advancedElicitation:
    enabled: false # Advanced meta-cognitive reasoning (default: off)
    methods: # Available reasoning methods
      - first-principles
      - pre-mortem
      - socratic
      - red-team-blue-team
    costBudget: 10.0 # Budget for elicitation queries (USD)
    minConfidence: 0.7 # Skip if confidence below threshold

# --- Memory Management (Token Budget Framework) ---
memory_management:
  # Token budget defaults per model
  token_budgets:
    haiku: 200000 # Max tokens per haiku-based agent
    sonnet: 200000 # Max tokens per sonnet-based agent
    opus: 1000000 # Max tokens per opus-based agent

  # Token tracking config
  token_tracking:
    enabled: true
    char_to_token_ratio: 0.75 # 1 char ≈ 0.75 tokens
    warn_threshold: 0.90 # Warn at 90% budget
    warn_message: 'Agent approaching token limit - consider compression'
    log_format: 'jsonl' # Save to .claude/context/token-usage.jsonl

  # Budget calculation config
  budget_calculation:
    include_prompt: true # Count prompt tokens
    include_tool_results: true # Count tool result tokens
    include_context: true # Count context tokens

  # Auto-compression config (Phase 3)
  auto_compression:
    enabled: true # ENABLED BY DEFAULT (ADR-108: dormant infrastructure activated)
    trigger_threshold: 0.90 # Compress at 90% budget (estimated)
    max_compressions_per_session: 5

