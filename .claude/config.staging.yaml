# Staging Environment Configuration
# This configuration is used when AGENT_STUDIO_ENV=staging

version: '2.2.2'
environment: staging

# --- Claude API Beta Headers (Context Management) ---
# Enables auto-clearing of stale tool results from context window (84% token reduction)
apiHeaders:
  - 'context-management-2025-06-27'

# --- Router Configuration (The Gatekeeper) ---
agent_routing:
  router:
    model: haiku
    complexity: low
    priority: highest
    context_strategy: minimal
    description: 'Lightweight router to classify intent and assign optimal agent/workflow.'

# --- Agent Defaults (Token Optimization) ---
defaults:
  context_strategy: lazy_load
  token_optimization:
    enabled: true
    pruning_threshold_lines: 100
    auto_summary: true

# --- Integration Settings ---
integrations:
  superpowers:
    tdd_enforcement: true
    plan_execution: batch
  claude_flow:
    swarm_topology: hierarchical
    consensus: byzantine

# --- Token Monitoring ---
token_monitoring:
  enabled: true
  max_session_tokens: 800000
  hard_limit: 950000
# --- Evolution Settings ---
evolution:
  auto_start: true
  rate_limit: 3
  rate_limit_window_ms: 3600000

# --- Monitoring Settings (Staging-Specific: Verbose + Relaxed Thresholds) ---
monitoring:
  enabled: true
  verboseLogging: true # More logging in staging
  dashboardRefreshMs: 5000 # 5s refresh rate
  thresholds:
    # Staging thresholds are 2x more lenient than production
    hookExecutionTimeMs: 200 # Production: 100ms
    hookFailureRate: 10 # Production: 5%
    agentFailureRate: 6 # Production: 3%
    errorRatePerHour: 20 # Production: 10
    tokenBudgetPerDay: 100000
  retention:
    metricsDays: 30
    errorsDays: 90
  dashboard:
    refreshIntervalMs: 5000

# --- Memory Management Configuration ---
memory:
  rotation:
    threshold_kb: 20
    max_age_days: 30
  pruning:
    similarity_threshold: 0.6
  cold_storage:
    max_age_days: 30

# --- Feature Flags (All Enabled in Staging for Testing) ---
features:
  partyMode:
    enabled: true # Enable for staging testing
    maxAgents: 5
    maxRounds: 20 # Staging: higher limit for testing (production: 10)
    contextWarning: 800000
    contextLimit: 950000
    costLimit: 50.0
  advancedElicitation:
    enabled: true # Enable for staging testing
    methods:
      - first-principles
      - pre-mortem
      - socratic
      - red-team-blue-team
    costBudget: 10.0
    minConfidence: 0.7
  knowledgeBase:
    enabled: true
  costTracking:
    enabled: true
  sidecarMemory:
    enabled: true # Enable for staging testing

# --- Memory Management (Token Budget Framework) ---
memory_management:
  token_budgets:
    haiku: 200000
    sonnet: 200000
    opus: 1000000
  token_tracking:
    enabled: true
    char_to_token_ratio: 0.75
    warn_threshold: 0.90
    warn_message: 'Agent approaching token limit - consider compression'
    log_format: 'jsonl'
  budget_calculation:
    include_prompt: true
    include_tool_results: true
    include_context: true
  auto_compression:
    enabled: true
    trigger_threshold: 0.90
    max_compressions_per_session: 5

# --- Staging-Specific Paths ---
# All staging data stored in .claude/staging/ to isolate from development/production
paths:
  knowledge: '.claude/staging/knowledge'
  metrics: '.claude/staging/metrics'
  memory: '.claude/staging/memory'
  agents: '.claude/staging/agents'
  sessions: '.claude/staging/sessions'
  context: '.claude/staging/context'

# --- Storage Configuration ---
storage:
  costLog: '.claude/staging/metrics/llm-usage.log'
  sessionLog: '.claude/staging/sessions/session-log.jsonl'
  evolutionState: '.claude/staging/context/evolution-state.json'
  metricsDir: '.claude/staging/metrics'

# --- Test Data Configuration ---
testData:
  enabled: true # Enable test data seeding
  seedData: true # Auto-populate with test data on init
  artifactsCount: 1133 # Copy all artifacts to staging KB

