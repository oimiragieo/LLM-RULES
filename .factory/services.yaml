commands:
  install: pnpm install
  test: pnpm test
  test:framework: pnpm test:framework
  test:all: pnpm test:all
  test:tools: pnpm test:tools
  test:code-indexing: pnpm test:code-indexing
  validate:full: pnpm validate:full
  validate:routing: pnpm validate:routing
  validate:skills: pnpm validate:skills
  validate:hooks:docs: pnpm validate:hooks:docs
  skills:ecosystem:gate: pnpm skills:ecosystem:gate
  metrics:ci: pnpm metrics:ci
  integration:headless: pnpm integration:headless
  format:check: pnpm format:check
  format: node scripts/format-tracked.mjs --write
  format:file: npx prettier --write
  lint: pnpm lint
  test:single: node --test
  charcount: node -e "const fs=require('fs');const p=require('path');let t=fs.readFileSync('.claude/CLAUDE.md','utf8').length;fs.readdirSync('.claude/rules').filter(f=>f.endsWith('.md')).forEach(f=>{t+=fs.readFileSync(p.join('.claude/rules',f),'utf8').length});console.log('Total:',t,t<40000?'PASS':'FAIL')"

services: {}
