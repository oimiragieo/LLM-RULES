commands:
  install: pnpm install
  test: node --test --test-concurrency=1 "tests/**/*.test.{mjs,cjs}"
  test_framework: node --test --test-concurrency=1 .claude/hooks/**/*.test.cjs .claude/lib/**/*.test.cjs tests/hooks/*.test.cjs tests/lib/**/*.test.cjs
  validate: pnpm validate:full:parallel
  validate_full: pnpm validate:full
  format: pnpm format
  format_check: pnpm format:check
  integration: pnpm integration:headless
  integration_json: pnpm integration:headless:json
  metrics_ci: pnpm metrics:ci
  lint: pnpm format:check

services: {}
